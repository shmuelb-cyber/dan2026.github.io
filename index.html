<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון גיל מודרני</title>
    <style>
        /* עיצוב רקע כללי מודרני עם גרדיאנט עדין */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* עיצוב כרטיסיית המחשבון */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* עיצוב תיבת ההקלדה המודרנית */
        input {
            width: 80%;
            padding: 14px 20px;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            color: #334155;
        }

        input:focus {
            border-color: #4f46e5;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* עיצוב כפתור מודרני עם אפקט ריחופ */
        button {
            width: 85%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
            transform: scale(1.02);
        }

        /* עיצוב תיבת התוצאה */
        #result {
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            color: #1e293b;
            line-height: 1.6;
            min-height: 50px;
        }

        .highlight-age {
            font-size: 24px;
            color: #4f46e5;
            font-weight: 800;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>מחשבון גיל חכם</h2>
        <p>הקלד שנת לידה כדי להתחיל</p>
        <input type="text" id="yearInput" placeholder="למשל: 1995" inputmode="numeric" pattern="[0-9]*">
        <br>
        <button onclick="calculateAge()">חשב גיל עכשיו</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateAge() {
            var year = document.getElementById('yearInput').value;
            if (!year || isNaN(year) || year < 1900 || year > 2026) { 
                document.getElementById('result').innerHTML = "<span style='color: #ef4444;'>נא להכניס שנה תקינה (למשל: 1995)</span>"; 
                return; 
            }
            var currentYear = 2026;
            var age = currentYear - parseInt(year);
            
            var message = "<span class='highlight-age'>הגיל שלך הוא: " + age + "</span>";
            if (age >= 18) { message += "איזה יופי, אתה כבר מבוגר ויכול להוציא רישיון נהיגה! 🚗"; }
            else { message += "אתה עדיין קטין, תהנה מהילדות כל עוד אתה יכול! 🧒"; }
            
            document.getElementById('result').innerHTML = message;
        }
    </script>
</body>
</html>
