<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Cyber-X 2026</title>
    <!-- ספריית קונפטי לחגיגות -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; overflow-x: hidden; }
        .card { background: rgba(20, 21, 33, 0.8); padding: 40px 30px; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
        h2 { background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 30px; margin-bottom: 5px; font-weight: bold; }
        input[type="date"] { width: 85%; padding: 15px; font-size: 18px; border: 2px solid rgba(0,242,254,0.2); border-radius: 16px; background: rgba(255,255,255,0.05); color: #fff; text-align: center; outline: none; }
        button { width: 92%; padding: 16px; font-size: 18px; font-weight: bold; color: #000; background: linear-gradient(90deg, #00f2fe, #4facfe); border: none; border-radius: 16px; cursor: pointer; margin-top: 25px; box-shadow: 0 0 20px rgba(0,242,254,0.4); }
        #result { margin-top: 25px; text-align: right; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; display: none; }
        .section-title { color: #00f2fe; font-weight: bold; margin-top: 15px; }
        .info-text { color: #cbd5e1; font-size: 15px; margin: 5px 0; line-height: 1.5; }
        .zodiac-badge { display: inline-block; background: linear-gradient(135deg, #f43f5e, #e11d48); padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>CYBER AGE 2026</h2>
        <p style="color:#8fa0a6; margin-bottom: 25px;">הזן תאריך לידה לניתוח חי בעברית מהרשת:</p>
        <input type="date" id="birthdate">
        <br>
        <button onclick="processData()">נתח תאריך לידה</button>
        <div id="result"></div>
    </div>
    <script>
        function getZodiac(day, month) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "טלה ♈";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "שור ♉";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "תאומים ♊";
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "סרטן ♋";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "אריה 🦁";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "בתולה ♍";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "מאזניים ♎";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "עקרב 🦂";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "קשת 🏹";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "גדי ♑";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "דלי ♒";
            return "דגים ♓";
        }

        // מערכת תרגום חלופית ויציבה
        async function translateToHebrew(text) {
            try {
                const response = await fetch("https://libretranslate.de", {
                    method: "POST",
                    body: JSON.stringify({
                        q: text,
                        source: "en",
                        target: "he",
                        format: "text"
                    }),
                    headers: { "Content-Type": "application/json" }
                });
                const data = await response.json();
                if(data && data.translatedText) return data.translatedText;
                return null;
            } catch (error) {
                return null; 
            }
        }

        // משיכת עובדה דרך שרת פרוקסי שעוקף חסימות אבטחה של דפדפנים
        async function fetchLiveFact(day, month) {
            try {
                const proxyUrl = "https://herokuapp.com";
                const targetUrl = `https://numbersapi.com{month}/${day}/date?json`;
                
                const response = await fetch(proxyUrl + targetUrl);
                const data = await response.json();
                if(data && data.text) return data.text;
                return null;
            } catch (error) {
                return null;
            }
        }

        async function processData() {
            const dateInput = document.getElementById('birthdate').value;
            if (!dateInput) { alert("אנא בחר תאריך לידה!"); return; }
            
            const birthDate = new Date(dateInput);
            const today = new Date();
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            if (days < 0) { months--; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            
            const bDay = birthDate.getDate();
            const bMonth = birthDate.getMonth() + 1;
            const bYear = birthDate.getFullYear();
            const zodiac = getZodiac(bDay, bMonth);
            
            const resDiv = document.getElementById('result');
            resDiv.innerHTML = "<div style='text-align:center;'>עוקף חסימות דפדפן ומתרגם... 🌐🔮</div>";
            resDiv.style.display = 'block';

            let finalFact = "לא הצלחנו למשוך מידע חי מהאינטרנט כרגע, אבל המערכת המקומית יציבה!";
            
            const liveFactEnglish = await fetchLiveFact(bDay, bMonth);
            if (liveFactEnglish) {
                const liveFactHebrew = await translateToHebrew(liveFactEnglish);
                if (liveFactHebrew) {
                    finalFact = liveFactHebrew;
                } else {
                    finalFact = liveFactEnglish + " (התרגום נכשל, מציג באנגלית)";
                }
            }
            
            let resultHtml = `
                <div class="section-title">⏱| ניתוח זמן קוונטי:</div>
                <div class="info-text">אתה בן <strong>${years}</strong> שנים, <strong>${months}</strong> חודשים ו-<strong>${days}</strong> ימים.</div>
                <div class="section-title">✨ מיקום כוכבים ומזל:</div>
                <div class="zodiac-badge">${zodiac}</div>
                <div class="section-title">📜 עובדה היסטורית חיה מהאינטרנט:</div>
                <div class="info-text" style="color: #00f2fe; font-style: italic;">${finalFact}</div>
            `;
            
            resDiv.innerHTML = resultHtml;
            try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch(e){}
        }
    </script>
</body>
</html>
