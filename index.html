<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Cyber-X 2026</title>
    <!-- ספריית קונפטי לחגיגות -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .audio-control {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .audio-control:hover { background: rgba(255, 255, 255, 0.2); }

        .card {
            background: rgba(20, 21, 33, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 242, 254, 0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        h2 {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #8fa0a6;
            font-size: 15px;
            margin-bottom: 30px;
        }

        input[type="date"] {
            width: 85%;
            padding: 16px;
            font-size: 18px;
            border: 2px solid rgba(0, 242, 254, 0.2);
            border-radius: 16px;
            outline: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        input[type="date"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 2px 4px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.07);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) drop-shadow(0 0 2px #00f2fe);
        }

        button.main-btn {
            width: 92%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button.main-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        #result {
            margin-top: 30px;
            text-align: right;
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            border-radius: 20px;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            color: #00f2fe;
            font-weight: 700;
            font-size: 16px;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-text {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 5px 0;
        }

        .zodiac-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3);
        }
    </style>
</head>
<body>

    <button class="audio-control" onclick="toggleMusic()" id="musicBtn">🎵 הפעל סאונד רקע</button>

    <div class="card">
        <h2>CYBER AGE 2026</h2>
        <div class="subtitle">הזן תאריך לידה לניתוח קוונטי מלא:</div>
        
        <input type="date" id="birthdate" max="2026-12-31">
        <br>
        <button class="main-btn" onclick="processData()" onmouseenter="playHoverSound()">נתח תאריך לידה</button>
        
        <div id="result"></div>
    </div>

    <audio id="bgMusic" loop src="https://soundhelix.com"></audio>
    <audio id="hoverSound" src="https://google.com"></audio>
    <audio id="successSound" src="https://google.com"></audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.15;

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("אנא אשר סאונד"));
                document.getElementById('musicBtn').innerText = "⏸️ השתק סאונד רקע";
            } else {
                bgMusic.pause();
                document.getElementById('musicBtn').innerText = "🎵 הפעל סאונד רקע";
            }
        }

        function playHoverSound() {
            const snd = document.getElementById('hoverSound');
            snd.volume = 0.2;
            snd.currentTime = 0;
            snd.play().catch(() => {});
        }

        function playSuccessSound() {
            const snd = document.getElementById('successSound');
            snd.volume = 0.4;
            snd.currentTime = 0;
            snd.play().catch(() => {});
        }

        function getZodiac(day, month) {
            // רשימת מזלות מתוקנת ומלאה
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "טלה ♈";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "שור ♉";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "תאומים ♊";
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "סרטן ♋";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "אריה 🦁";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "בתולה ♍";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "מאזניים ♎";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "עקרב 🦂";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "קשת 🏹";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "גדי ♑";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "דלי ♒";
            return "דגים ♓";
        }
